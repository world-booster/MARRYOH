# MariaDB - GitHub Actions service container
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/grape_test
spring.datasource.username=grape_test
spring.datasource.password=grape_test_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Redis - GitHub Actions service container
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# JWT 테스트 값
auth.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
auth.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000
app.csrf.secret=${CSRF_SECRET}

# OAuth2 테스트용 더미 값
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret
spring.security.oauth2.client.registration.google.scope=profile,email

# 메일 테스트 설정
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test