################################################
# Application
################################################

server.port=0
spring.application.name=grape-ci

# log4j2.xml이 Git에 포함되어 있을 때만 사용
logging.config=classpath:log4j2.xml


################################################
# Database - GitHub Actions MariaDB
################################################

spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/grape_test?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=grape_test
spring.datasource.password=grape_test_password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver


################################################
# JPA
################################################

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true


################################################
# MyBatis
################################################

mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.type-aliases-package=com.grape
mybatis.configuration.map-underscore-to-camel-case=true


################################################
# Redis - GitHub Actions Redis
################################################

spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379


################################################
# Mail - CI 전용 더미값
################################################

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=ci-test
spring.mail.password=ci-test

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# 테스트 중 SMTP 연결을 시도할 경우 즉시 실패하도록 제한
spring.mail.properties.mail.smtp.connectiontimeout=1000
spring.mail.properties.mail.smtp.timeout=1000
spring.mail.properties.mail.smtp.writetimeout=1000


################################################
# Encoding
################################################

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true


################################################
# Logging
################################################

logging.level.root=INFO

logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.socket=WARN
logging.level.org.springframework.messaging=WARN
logging.level.org.hibernate=WARN

logging.level.com.grape=INFO


################################################
# Email Verification Security
################################################

security.email.pepper=grape-ci-email-verification-pepper-only-for-testing
security.email.ttl=5m
security.email.cooldown=10s
security.email.max-attempts=5
security.email.lock-time=10m


################################################
# User Defaults
################################################

user.default.login-auth=L
user.default.admin-yn=N
user.default.social-login-yn=N


################################################
# Google OAuth - CI 전용 더미값
################################################

social.google.client-id=ci-google-client-id
social.google.client-secret=ci-google-client-secret
social.google.redirect-uri=http://localhost:3000/oauth/google/callback
social.google.token-uri=https://oauth2.googleapis.com/token
social.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
social.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth


################################################
# Kakao OAuth - CI 전용 더미값
################################################

social.kakao.client-id=ci-kakao-client-id
social.kakao.client-secret=ci-kakao-client-secret
social.kakao.redirect-uri=http://localhost:3000/oauth/kakao/callback
social.kakao.token-uri=https://kauth.kakao.com/oauth/token
social.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
social.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize


################################################
# Naver OAuth - CI 전용 더미값
################################################

social.naver.client-id=ci-naver-client-id
social.naver.client-secret=ci-naver-client-secret
social.naver.redirect-uri=http://localhost:3000/oauth/naver/callback
social.naver.token-uri=https://nid.naver.com/oauth2.0/token
social.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
social.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize


################################################
# JWT - GitHub Actions에서 임시 생성
################################################

auth.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
auth.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}


################################################
# Cookie / CSRF
################################################

app.cookie.secure=false
app.csrf.secret=grape-ci-csrf-secret-key-only-for-testing-2026