name: Grape Backend CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: grape_test
          MARIADB_USER: grape_test
          MARIADB_PASSWORD: grape_test_password
          MARIADB_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test --no-daemon --stacktrace
        env:
          SPRING_PROFILES_ACTIVE: ci

      - name: Build application
        run: ./gradlew build -x test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: grape-backend-build
          path: |
            build/libs/*.jar
            build/libs/*.war
          if-no-files-fount: error
          retention-dats: 7