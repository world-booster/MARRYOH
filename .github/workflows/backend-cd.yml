name: Grape Backend CD

on:
  workflow_run:
    workflows:
      - Grape Backend CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: marryoh-backend-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.full_image }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Spring Boot JAR
        run: ./gradlew clean bootJar -x test --no-daemon

      - name: Create image name
        id: image
        shell: bash
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail

          IMAGE_NAME="$(
            printf '%s' "$GITHUB_REPOSITORY" |
              tr '[:upper:]' '[:lower:]'
          )"

          SHORT_SHA="$(
            printf '%s' "$TESTED_SHA" |
              cut -c1-7
          )"

          FULL_IMAGE="ghcr.io/${IMAGE_NAME}:sha-${SHORT_SHA}"
          LATEST_IMAGE="ghcr.io/${IMAGE_NAME}:latest"

          echo "full_image=${FULL_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "latest_image=${LATEST_IMAGE}" >> "$GITHUB_OUTPUT"

          echo "Full image: ${FULL_IMAGE}"
          echo "Latest image: ${LATEST_IMAGE}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.full_image }}
            ${{ steps.image.outputs.latest_image }}

  deploy:
    name: Deploy production
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          SSH_HOST_KEY: ${{ secrets.PROD_SSH_HOST_KEY }}
        run: |
          set -Eeuo pipefail

          echo "Checking required SSH secrets..."

          if [ -z "${SSH_HOST:-}" ]; then
            echo "ERROR: PROD_SSH_HOST is empty."
            exit 1
          fi

          if [ -z "${SSH_PORT:-}" ]; then
            echo "ERROR: PROD_SSH_PORT is empty."
            exit 1
          fi

          if [ -z "${SSH_USER:-}" ]; then
            echo "ERROR: PROD_SSH_USER is empty."
            exit 1
          fi

          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "ERROR: PROD_SSH_PRIVATE_KEY is empty."
            exit 1
          fi

          if [ -z "${SSH_HOST_KEY:-}" ]; then
            echo "ERROR: PROD_SSH_HOST_KEY is empty."
            exit 1
          fi

          if ! [[ "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: PROD_SSH_PORT must be numeric."
            exit 1
          fi

          echo "SSH secrets are configured."

          install -m 700 -d "$HOME/.ssh"

          echo "Writing deployment private key..."

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/id_ed25519"

          chmod 600 "$HOME/.ssh/id_ed25519"

          echo "Validating deployment private key..."

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/id_ed25519" \
            > /dev/null

          echo "Deployment private key is valid."

          echo "Creating pinned known_hosts entry..."

          printf '[%s]:%s %s\n' \
            "$SSH_HOST" \
            "$SSH_PORT" \
            "$SSH_HOST_KEY" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Validating known_hosts entry..."

          if ! ssh-keygen \
            -F "[$SSH_HOST]:$SSH_PORT" \
            -f "$HOME/.ssh/known_hosts" \
            > /dev/null; then
            echo "ERROR: Failed to find server entry in known_hosts."
            exit 1
          fi

          echo "Checking SSH connectivity and authentication..."

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH authentication succeeded.'"

          echo "SSH configuration completed."

      - name: Log in to GHCR on production server
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [ -z "${GHCR_USERNAME:-}" ]; then
            echo "ERROR: GHCR_USERNAME is empty."
            exit 1
          fi

          if [ -z "${GHCR_TOKEN:-}" ]; then
            echo "ERROR: GHCR_TOKEN is empty."
            exit 1
          fi

          if ! [[ "$GHCR_USERNAME" =~ ^[A-Za-z0-9-]+$ ]]; then
            echo "ERROR: GHCR_USERNAME contains invalid characters."
            exit 1
          fi

          echo "Logging in to GHCR on production server..."

          printf '%s' "$GHCR_TOKEN" |
            ssh \
              -i "$HOME/.ssh/id_ed25519" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -p "$SSH_PORT" \
              "$SSH_USER@$SSH_HOST" \
              "docker login ghcr.io \
                --username '$GHCR_USERNAME' \
                --password-stdin"

          echo "GHCR login completed."

      - name: Deploy backend
        shell: bash
        env:
          SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          SSH_USER: ${{ secrets.PROD_SSH_USER }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -Eeuo pipefail

          if [ -z "${BACKEND_IMAGE:-}" ]; then
            echo "ERROR: BACKEND_IMAGE is empty."
            exit 1
          fi

          if ! [[ "$BACKEND_IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+:[A-Za-z0-9._-]+$ ]]; then
            echo "ERROR: BACKEND_IMAGE has an invalid format."
            exit 1
          fi

          echo "Starting backend deployment..."
          echo "Deployment image: $BACKEND_IMAGE"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o PreferredAuthentications=publickey \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$BACKEND_IMAGE'" <<'REMOTE'
          set -Eeuo pipefail

          BACKEND_IMAGE="$1"

          readonly DEPLOY_DIR="/svc/marryoh"
          readonly SERVICE_NAME="backend"
          readonly CONTAINER_NAME="marryoh-backend"

          echo "Connected to production server."
          echo "Deployment directory: $DEPLOY_DIR"
          echo "Backend image: $BACKEND_IMAGE"

          if ! command -v docker > /dev/null 2>&1; then
            echo "ERROR: Docker is not installed."
            exit 1
          fi

          if ! docker compose version > /dev/null 2>&1; then
            echo "ERROR: Docker Compose plugin is not available."
            exit 1
          fi

          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "ERROR: Deployment directory does not exist."
            exit 1
          fi

          cd "$DEPLOY_DIR"

          if [ ! -d "config" ]; then
            echo "ERROR: Production config directory does not exist."
            exit 1
          fi

          export BACKEND_IMAGE

          echo "Validating Docker Compose configuration..."

          if ! docker compose config > /dev/null; then
            echo "ERROR: Docker Compose configuration is invalid."
            exit 1
          fi

          echo "Pulling backend image..."
          docker compose pull "$SERVICE_NAME"

          echo "Recreating backend container..."
          docker compose up \
            -d \
            --no-deps \
            "$SERVICE_NAME"

          echo "Verifying container creation..."

          if ! docker inspect "$CONTAINER_NAME" > /dev/null 2>&1; then
            echo "ERROR: Backend container was not created."
            docker compose ps
            exit 1
          fi

          HAS_HEALTHCHECK="$(
            docker inspect \
              --format='{{if .Config.Healthcheck}}yes{{else}}no{{end}}' \
              "$CONTAINER_NAME"
          )"

          if [ "$HAS_HEALTHCHECK" != "yes" ]; then
            echo "ERROR: Backend container does not have a healthcheck."
            docker compose ps "$SERVICE_NAME"
            docker logs --tail 200 "$CONTAINER_NAME" || true
            exit 1
          fi

          echo "Waiting for backend healthcheck..."

          for attempt in $(seq 1 24); do
            STATUS="$(
              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$CONTAINER_NAME" 2>/dev/null \
                || echo "not-found"
            )"

            echo "Healthcheck attempt ${attempt}/24: $STATUS"

            if [ "$STATUS" = "healthy" ]; then
              echo "Backend deployment succeeded."
              docker compose ps "$SERVICE_NAME"
              docker image prune -f
              exit 0
            fi

            if [ "$STATUS" = "unhealthy" ] \
              || [ "$STATUS" = "exited" ] \
              || [ "$STATUS" = "dead" ] \
              || [ "$STATUS" = "not-found" ]; then
              echo "ERROR: Backend deployment failed."
              docker compose ps "$SERVICE_NAME" || true
              docker logs --tail 200 "$CONTAINER_NAME" || true
              exit 1
            fi

            sleep 5
          done

          echo "ERROR: Backend healthcheck timed out."
          docker compose ps "$SERVICE_NAME" || true
          docker logs --tail 200 "$CONTAINER_NAME" || true
          exit 1
          REMOTE