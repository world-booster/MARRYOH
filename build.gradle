plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.5.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.grape'
version = '0.0.1-SNAPSHOT'
description = 'Grape Project'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    /*2025.09.06 트랜잭션 테스트를 위해 삽입*/
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    //runtimeOnly 'com.h2database:h2'
    /*2025.09.08 유효성 검사 의존성 추가*/
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    /*2025.09.09 bcrypt암호화를 위해 보안 의존성 추가*/
    implementation 'org.springframework.boot:spring-boot-starter-security'
	/*외장 톰캣을 사용시*/
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	/*2025.09.25 uuid-v7 사용을 위한 의존성 추가*/
	implementation 'com.fasterxml.uuid:java-uuid-generator:5.1.0'
	/*2025.10.10 jwt 사용을 위한 의존성 추가*/
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' //JSON 처리 라이브러리
	/*2025.10.25 email 인증을 위한 의존성 추가*/
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	/*2026.05.19 websocket 의존성 추가*/
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	/*2026.07.22 CI를 위한 test 의존성 추가*/
	testRuntimeOnly 'com.h2database:h2'
	/*2026.07.27 CD healthcare를 위한 의존성 추가*/
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
}
tasks.register('explodedWar', Copy) {
	dependsOn(tasks.named('war'))
	from {
		zipTree(tasks.named('war').get().archiveFile.get())
	}
	into "${buildDir}/exploded"
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.bootJar {
	exclude("application.properties")
	exclude("database.properties")
	exclude("keys/private.pem")
	exclude("keys/public.pem")
}

tasks.jar {
	exclude("application.properties")
	exclude("database.properties")
	exclude("keys/private.pem")
	exclude("keys/public.pem")
}

jar {
	enabled = false
}

bootJar {
	enabled = true
}

